[package]
name = "rotf-export"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"
description = "Writes a robot from the user's own install of Transformers: Revenge of the Fallen as glTF, PNG and DDS, for modding tools. Ships no game files."

[dependencies]
tf2-core = { path = "../core" }
# The same versions tf2-core already uses.
glam = "0.34"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1"

[dev-dependencies]
# Reads the written files back in the tests.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }

[lints]
workspace = true
