[workspace]
resolver = "3"
members = ["core", "export"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Lints the code breaks on purpose. Long argument lists and indexed loops mirror the game's own
# routines; constants keep the game's exact digits; `!(a < b)` on floats is kept because rewriting
# it changes what a NaN does.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
excessive_precision = "allow"
neg_cmp_op_on_partial_ord = "allow"
