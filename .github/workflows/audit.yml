# The dependencies against the RustSec advisory database: on every change to Cargo.lock, and weekly
# for advisories published since.
name: Audit

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock']
  pull_request:
    paths: ['**/Cargo.toml', 'Cargo.lock']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
